<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<meta name="color-scheme" content="light" />
		<meta name="theme-color" content="#ffffff" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Anek+Latin:wght@300..800&family=Mukta:wght@300;400;500;600;700;800&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
			rel="stylesheet"
		/>

		<!-- Only what is identical on every page belongs in this file. The title,
		     description, canonical, robots directive and social cards are
		     per-page and come from Seo.svelte, injected at the placeholder near
		     the end of this head.

		     They were hardcoded here once, which put a second, static title tag
		     ahead of every page's real one: every server-rendered page, and so
		     every crawler and social card, saw the homepage title instead. The
		     canonical was worse, naming the homepage on all 37 pages, which asks
		     Google to treat the whole site as one duplicate. -->
		<meta
			name="keywords"
			content="IITG TIC, IIT Guwahati, technology incubation, startup incubator, deep tech, North East India, IITG incubator, startup funding, entrepreneurship, IIT Guwahati incubation centre"
		/>
		<meta name="author" content="IIT Guwahati Technology Incubation Centre" />
		<meta property="og:site_name" content="IIT Guwahati Technology Incubation Centre" />
		<meta property="og:locale" content="en_IN" />

		<script nonce="%sveltekit.nonce%" type="application/ld+json">
			{
				"@context": "https://schema.org",
				"@type": "Organization",
				"name": "IIT Guwahati Technology Incubation Centre",
				"alternateName": "IITG TIC",
				"url": "https://iitgtic.itsjeu.com",
				"logo": "https://iitgtic.itsjeu.com/brand/tic-iitg-horizontal-color.svg",
				"description": "IIT Guwahati Technology Incubation Centre supports deep-tech startups with incubation, mentorship, infrastructure, and funding.",
				"address": {
					"@type": "PostalAddress",
					"addressLocality": "Guwahati",
					"addressRegion": "Assam",
					"addressCountry": "IN"
				},
				"parentOrganization": {
					"@type": "CollegeOrUniversity",
					"name": "Indian Institute of Technology Guwahati",
					"url": "https://www.iitg.ac.in"
				}
			}
		</script>

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
